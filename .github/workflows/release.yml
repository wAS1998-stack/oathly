name: Release build (signed AAB for Google Play)

# Run manually from the Actions tab. Needs these repository secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   (your upload key)
#   OATHLY_ADMOB_APP_ID, OATHLY_ADMOB_BANNER_ID, OATHLY_ADMOB_INTERSTITIAL_ID
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Refresh officials snapshot bundled in the app
        run: python3 pipeline/build_officials.py

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Add the KEYSTORE_BASE64 secret first" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build signed bundle
        env:
          OATHLY_ADMOB_APP_ID: ${{ secrets.OATHLY_ADMOB_APP_ID }}
          OATHLY_ADMOB_BANNER_ID: ${{ secrets.OATHLY_ADMOB_BANNER_ID }}
          OATHLY_ADMOB_INTERSTITIAL_ID: ${{ secrets.OATHLY_ADMOB_INTERSTITIAL_ID }}
          OATHLY_DATA_BASE_URL: ${{ vars.OATHLY_DATA_BASE_URL }}
          OATHLY_VERSION_CODE: ${{ github.run_number }}
        run: |
          for v in OATHLY_ADMOB_APP_ID OATHLY_ADMOB_BANNER_ID OATHLY_ADMOB_INTERSTITIAL_ID; do
            test -n "${!v}" || (echo "::error::Add the $v secret before building a release" && exit 1)
          done
          ./gradlew --no-daemon testReleaseUnitTest lintRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: oathly-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
